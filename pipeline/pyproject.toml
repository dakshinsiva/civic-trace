[project]
name = "civictrace"
version = "0.1.0"
description = "Open-source procurement risk indicators for Bengaluru (KPPP)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "typer>=0.12",
  "selectolax>=0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
civictrace = "civictrace.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["civictrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:openpyxl"]
